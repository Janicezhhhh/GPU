name: CUDA RMSNorm CPU checks

on:
  push:
    paths:
      - 'cuda-rmsnorm/**'
      - '.github/workflows/cuda-rmsnorm-cpu.yml'
  pull_request:
    paths:
      - 'cuda-rmsnorm/**'
      - '.github/workflows/cuda-rmsnorm-cpu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cuda-rmsnorm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cuda-rmsnorm/requirements-cpu.txt
      - name: Install CPU test environment
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-cpu.txt
          python -m pip install -e . --no-build-isolation --no-deps
      - name: Check environment and CPU behavior
        run: |
          python scripts/doctor.py
          python -m pytest -q -ra --junitxml=results/cpu-tests.xml
          python -m rmsnorm_lab.lesson
          python -m compileall -q rmsnorm_lab scripts tests
      - name: Build distributable package
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rmsnorm-cpu-tests
          path: cuda-rmsnorm/results/cpu-tests.xml
          if-no-files-found: ignore
