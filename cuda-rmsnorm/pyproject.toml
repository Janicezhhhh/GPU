[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cuda-rmsnorm-lab"
version = "0.1.0"
description = "Reproducible CUDA RMSNorm and residual fusion experiments"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "ninja"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["rmsnorm_lab*"]

[tool.setuptools.package-data]
rmsnorm_lab = ["csrc/*.cpp", "csrc/*.cu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
